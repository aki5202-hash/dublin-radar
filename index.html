  <script>
    const CAT_HINT = { "食": "美食飲品", "衣": "時尚衣著", "住": "居家設計", "行": "出行探路", "育": "學習工作坊", "樂": "娛樂夜生活" };
    const CATS = ["食", "衣", "住", "行", "育", "樂"];
    const TZ = "Europe/Dublin";

    const state = { cat: "all", date: "all", sort: "rating", q: "" };
    let DATA = null;
    let TODAY = "";
    let WEEKEND_FROM = "";
    let WEEKEND_TO = "";
    let WEEK_TO = "";
    let LATER_FROM = "";

    function pad(n) { return String(n).padStart(2, "0"); }

    function dublinNowParts(d) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).formatToParts(d || new Date());
      const get = (t) => parts.find((p) => p.type === t).value;
      return {
        year: get("year"),
        month: get("month"),
        day: get("day"),
        weekday: get("weekday"),
        hour: get("hour"),
        minute: get("minute")
      };
    }

    function isoFromParts(p) { return p.year + "-" + p.month + "-" + p.day; }

    function addDays(iso, n) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + n);
      return dt.getUTCFullYear() + "-" + pad(dt.getUTCMonth() + 1) + "-" + pad(dt.getUTCDate());
    }

    function weekdayIndex(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    }

    function computeDates() {
      TODAY = isoFromParts(dublinNowParts());
      const dow = weekdayIndex(TODAY); // 0 Sun .. 6 Sat
      const toSun = dow === 0 ? 0 : 7 - dow;
      WEEK_TO = addDays(TODAY, toSun);
      const toSat = dow === 0 ? -1 : 6 - dow;
      WEEKEND_FROM = addDays(TODAY, toSat);
      WEEKEND_TO = WEEK_TO;
      LATER_FROM = addDays(WEEK_TO, 1);
    }

    function formatUpdated(stamp) {
      if (!stamp) return "時間未知";
      const [d, t] = String(stamp).split("T");
      const bits = d.split("-");
      return bits[0] + "年" + Number(bits[1]) + "月" + Number(bits[2]) + "日 " + (t || "") + "（都柏林時間）";
    }

    function overlaps(item, from, to) {
      const s = item.start;
      const e = item.end || item.start;
      return s <= to && e >= from;
    }

    function inDateFilter(item, filter) {
      if (filter === "all") return true;
      if (filter === "today") return overlaps(item, TODAY, TODAY);
      if (filter === "weekend") return overlaps(item, WEEKEND_FROM, WEEKEND_TO);
      if (filter === "week") return overlaps(item, TODAY, WEEK_TO);
      return item.end ? item.end >= LATER_FROM : item.start >= LATER_FROM;
    }

    function matchesQuery(item, q) {
      if (!q) return true;
      const hay = [item.name, item.hook, item.venue, item.area, item.sourceName, item.shopType, item.note, item.dateLabel]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return hay.includes(q);
    }

    function ratingMarks(n) {
      let html = "";
      for (let i = 0; i < 5; i++) html += '<span class="dot' + (i < n ? " on" : "") + '">◆</span>';
      return html;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function cardHTML(item) {
      const flags = [];
      if (item.openingStatus) flags.push('<span class="flag status">' + escapeHtml(item.openingStatus) + "</span>");
      if (item.note) flags.push('<span class="flag">' + escapeHtml(item.note) + "</span>");
      const mid = item.shopType
        ? "<li><span>類型</span>" + escapeHtml(item.shopType) + "</li>"
        : "<li><span>票價</span>" + escapeHtml(item.price) + "</li>";
      return (
        '<article class="card cat-' + item.category + '">' +
          '<header class="card-top">' +
            '<span class="pill">' + item.category + "<i>" + CAT_HINT[item.category] + "</i></span>" +
            flags.join("") +
          "</header>" +
          "<h3>" + escapeHtml(item.name) + "</h3>" +
          '<p class="hook">' + escapeHtml(item.hook) + "</p>" +
          '<ul class="meta">' +
            "<li><span>日期</span>" + escapeHtml(item.dateLabel) + "</li>" +
            "<li><span>地點</span>" + escapeHtml(item.venue) + " · " + escapeHtml(item.area) + "</li>" +
            mid +
          "</ul>" +
          '<footer class="card-foot">' +
            '<div class="rating" title="獵奇度 ' + item.rating + ' / 5">' +
              "<b>獵奇度</b><span>" + ratingMarks(item.rating) + "</span>" +
              '<span class="rating-num">' + item.rating + "</span>" +
            "</div>" +
            '<a class="src" href="' + escapeHtml(item.source) + '" target="_blank" rel="noopener noreferrer">來源：' +
              escapeHtml(item.sourceName) + " ↗</a>" +
          "</footer>" +
        "</article>"
      );
    }

    function renderChips() {
      const items = DATA.items || [];
      const events = items.filter((i) => i.kind === "event");
      const counts = { 食: 0, 衣: 0, 住: 0, 行: 0, 育: 0, 樂: 0 };
      events.forEach((e) => { counts[e.category] += 1; });

      const catBox = document.getElementById("cats");
      const catBtns = [{ id: "all", label: "全部", n: events.length }].concat(
        CATS.map((c) => ({ id: c, label: c, n: counts[c] }))
      );
      catBox.innerHTML = catBtns.map((c) =>
        '<button type="button" class="chip" data-cat="' + c.id + '" aria-pressed="' + (state.cat === c.id) + '">' +
          c.label + "<em>" + c.n + "</em></button>"
      ).join("");

      const dateHints = {
        all: "全部日期",
        today: "今天",
        weekend: "本週末",
        week: "本週",
        later: "之後"
      };
      document.getElementById("dates").innerHTML = Object.keys(dateHints).map((id) =>
        '<button type="button" class="chip" data-date="' + id + '" aria-pressed="' + (state.date === id) + '">' +
          dateHints[id] + "</button>"
      ).join("");

      document.getElementById("sorts").innerHTML = [
        ["rating", "獵奇度"],
        ["date", "日期"]
      ].map(([id, label]) =>
        '<button type="button" class="chip" data-sort="' + id + '" aria-pressed="' + (state.sort === id) + '">' +
          label + "</button>"
      ).join("");
    }

    function render() {
      const q = state.q.trim().toLowerCase();
      const items = DATA.items || [];
      const openings = items
        .filter((i) => i.kind === "opening")
        .filter((i) => (state.cat === "all" || i.category === state.cat) && matchesQuery(i, q))
        .sort((a, b) => a.start.localeCompare(b.start));

      let events = items
        .filter((i) => i.kind === "event")
        .filter((i) => (state.cat === "all" || i.category === state.cat) && inDateFilter(i, state.date) && matchesQuery(i, q));

      if (state.sort === "rating") {
        events = events.slice().sort((a, b) => b.rating - a.rating || a.start.localeCompare(b.start));
      } else {
        events = events.slice().sort((a, b) => {
          const as = a.start < TODAY && (!a.end || a.end >= TODAY) ? TODAY : a.start;
          const bs = b.start < TODAY && (!b.end || b.end >= TODAY) ? TODAY : b.start;
          return as.localeCompare(bs) || b.rating - a.rating;
        });
      }

      const openBox = document.getElementById("openings");
      const openSec = document.getElementById("new-shops");
      document.getElementById("open-cap").textContent =
        "近約四週內剛開業、重新開張，或即將開門的餐廳、咖啡、酒吧與小店。目前顯示 " + openings.length + " 則。";
      if (openings.length) {
        openSec.hidden = false;
        openBox.innerHTML = openings.map(cardHTML).join("");
      } else {
        openSec.hidden = !q && state.cat === "all" ? false : true;
        openBox.innerHTML = (q || state.cat !== "all") ? "" : '<p class="empty">目前沒有新店情報。</p>';
        if (q || state.cat !== "all") openSec.hidden = true;
      }

      const evBox = document.getElementById("events");
      if (events.length) {
        evBox.innerHTML = events.map(cardHTML).join("");
        document.getElementById("event-cap").textContent =
          "目前顯示 " + events.length + " 項。本週末指 " + WEEKEND_FROM.slice(5).replace("-", "月") + "–" +
          WEEKEND_TO.slice(8) + "日，本週指至 " + WEEK_TO.slice(5).replace("-", "月") + "日。";
      } else {
        evBox.innerHTML = '<p class="empty">這組篩選下沒有符合的活動。換個關鍵字、類別或日期試試。</p>';
        document.getElementById("event-cap").textContent = "目前沒有符合的活動。";
      }

      document.getElementById("count").textContent = "顯示 " + events.length + " 項活動";
      renderChips();
    }

    function bind() {
      document.getElementById("cats").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-cat]");
        if (!btn) return;
        state.cat = btn.getAttribute("data-cat");
        render();
      });
      document.getElementById("dates").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-date]");
        if (!btn) return;
        state.date = btn.getAttribute("data-date");
        render();
      });
      document.getElementById("sorts").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-sort]");
        if (!btn) return;
        state.sort = btn.getAttribute("data-sort");
        render();
      });
      document.getElementById("q").addEventListener("input", (e) => {
        state.q = e.target.value;
        render();
      });
    }

    function fallbackData() {
      const el = document.getElementById("fallback-data");
      return JSON.parse(el.textContent);
    }

    async function loadData() {
      try {
        const r = await fetch("data.json", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const json = await r.json();
        if (!json || !Array.isArray(json.items) || !json.items.length) throw new Error("empty");
        return json;
      } catch (err) {
        return fallbackData();
      }
    }

    async function init() {
      computeDates();
      DATA = await loadData();
      const stamp = formatUpdated(DATA.lastUpdated);
      document.getElementById("updated").textContent = "最後更新：" + stamp;
      document.getElementById("foot-updated").textContent =
        "預定每三小時更新 · 都柏林時間 · 最後更新 " + stamp;
      bind();
      render();
    }

    init();
  </script>
